name: localshare
description: Cross-platform, serverless local file sharing (AirDrop/Quick Share style) for mobile, desktop and TV.
publish_to: none
version: 0.1.1+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Discovery: mDNS / DNS-SD (advertise + discover on Android/iOS/macOS/Windows)
  nsd: ^4.0.3
  # Pure-Dart mDNS fallback (Linux, or when the native plugin is unavailable)
  multicast_dns: ^0.3.2+7

  # Discovery + control: Bluetooth Low Energy
  flutter_blue_plus: ^1.35.3

  # Connection: hotspot / Wi-Fi Direct / network info
  network_info_plus: ^6.1.3
  wifi_iot: ^0.3.19+3

  # Security / crypto
  basic_utils: ^5.7.1
  crypto: ^3.0.6
  convert: ^3.1.1

  # Transport support
  shelf: ^1.4.2
  web_socket_channel: ^3.0.1

  # Permissions, files, misc
  # 13.x pulls permission_handler_android 14.x, which needs Kotlin 2.3/AGP 9.
  permission_handler: ^12.0.3
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  path: ^1.9.0
  device_info_plus: ^11.2.0
  uuid: ^4.5.1
  mime: ^2.0.0

  # Desktop drag-and-drop of files onto the window
  desktop_drop: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.8
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
