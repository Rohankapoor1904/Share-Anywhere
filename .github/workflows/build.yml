name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.1
          channel: stable
          cache: true

      - name: Build release APKs
        run: |
          flutter pub get
          # Universal APK first: installs on any device.
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/LocalShare-universal.apk
          # Smaller per-ABI APKs.
          flutter build apk --release --split-per-abi

      - name: Rename split APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk LocalShare-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk LocalShare-armeabi-v7a.apk
          mv app-x86_64-release.apk LocalShare-x86_64.apk
          ls -la LocalShare-*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/LocalShare-*.apk
          if-no-files-found: error

  linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.1
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package
        run: |
          cd build/linux/x64/release && tar -czf "$GITHUB_WORKSPACE/LocalShare-linux-x64.tar.gz" bundle
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: LocalShare-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.1
          channel: stable
          cache: true
      - name: Build
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath LocalShare-windows-x64.zip
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: LocalShare-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.1
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          flutter build macos --release
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/LocalShare-macos.zip" localshare.app
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: LocalShare-macos.zip
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [android, linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: false
