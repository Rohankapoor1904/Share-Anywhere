name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Analyze and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-linux:
    name: Build Linux release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev xvfb
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.1
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          flutter build linux --release
      - name: Headless smoke test
        run: |
          set +e
          timeout 30 xvfb-run -a ./build/linux/x64/release/bundle/localshare > smoke.log 2>&1
          code=$?
          # 124 = still running when timeout hit (expected for a GUI app).
          if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
            echo "App exited unexpectedly with code $code"; cat smoke.log; exit 1
          fi
          if grep -qiE "exception|error:.*dart|Unhandled" smoke.log; then
            echo "Dart errors in smoke log"; cat smoke.log; exit 1
          fi
          echo "Smoke OK (exit $code)"
